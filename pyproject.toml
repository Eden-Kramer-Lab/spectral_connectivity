[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]  # 1.27: PEP 639 license expressions
build-backend = "hatchling.build"

[project]
name = "spectral_connectivity"
dynamic = ["version"]
description = "Frequency domain functional and directed connectivity analysis tools for electrophysiological data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "python",
    "neuroscience",
    "electrophysiology",
    "multitaper",
    "spectrogram",
    "frequency-domain",
    "connectivity",
    "coherence",
    "granger-causality",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]

# Dependency-floor policy: each lower bound is the oldest version the code is
# actually tested against. The `test-min-deps` CI job installs exactly these
# minimums (and the minimum Python) and runs the suite, so a floor cannot drift
# out of sync with the code. Raise a floor only when a feature requires it (with
# a comment saying why) or to follow the Scientific Python SPEC 0 support window.
dependencies = [
    # <3.0: untested against a future NumPy major; lift once the suite passes on it.
    "numpy>=1.24,<3.0",
    "scipy>=1.11.1",  # false_discovery_control (statistics.py); 1.11.0 is yanked
    "xarray>=2023.1",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
# `pip install -e .[dev]`. Keep `dev` identical to the `dev` dependency group
# below, which `uv sync` installs by default.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "syrupy>=4.0",
    "nitime",
    "ruff>=0.8.0",
    "mypy>=1.11",  # PEP 695 `type` statement parsing (used by NumPy 2.x stubs)
    "scipy-stubs",
    "numpydoc>=1.6",
    # NetCDF engines for the result round-trip tests (xarray's default writers).
    "netCDF4",
    "h5netcdf",
    "h5py",
]
# CuPy 13 added cupyx.scipy.signal.detrend, which transforms.detrend delegates to.
gpu = ["cupy-cuda12x>=13.0"]

[dependency-groups]
# `uv sync` installs the package in editable mode plus this group. Keep
# identical to the `dev` extra above.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "syrupy>=4.0",
    "nitime",
    "ruff>=0.8.0",
    "mypy>=1.11",
    "scipy-stubs",
    "numpydoc>=1.6",
    # NetCDF engines for the result round-trip tests (xarray's default writers).
    "netCDF4",
    "h5netcdf",
    "h5py",
]

[project.urls]
Homepage = "https://github.com/Eden-Kramer-Lab/spectral_connectivity"
Repository = "https://github.com/Eden-Kramer-Lab/spectral_connectivity"
Documentation = "https://spectral-connectivity.readthedocs.io/en/latest/"
"Bug Reports" = "https://github.com/Eden-Kramer-Lab/spectral_connectivity/issues"
Changelog = "https://github.com/Eden-Kramer-Lab/spectral_connectivity/blob/master/CHANGELOG.md"
"Source Code" = "https://github.com/Eden-Kramer-Lab/spectral_connectivity"
"Issue Tracker" = "https://github.com/Eden-Kramer-Lab/spectral_connectivity/issues"


[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "-q",
    "--strict-config",
    "--strict-markers",
    "--cov=src/spectral_connectivity",
    "--cov-report=term-missing",
]
xfail_strict = true
log_level = "INFO"
# Every warning fails the test run unless the test asserts it (pytest.warns).
filterwarnings = [
    "error",
    # Third-party, not this package: netCDF4's compiled extension triggers
    # NumPy's benign binary-compatibility check on import, and xarray's netCDF4
    # backend sets ndarray.shape in place, which NumPy 2.5 deprecates.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: requires a working CUDA device and CuPy installation",
]

[tool.coverage.run]
branch = true
# by path: with the src layout, the module name resolves ambiguously between the
# project root and src on sys.path, and coverage then reports the package unmeasured
source = ["src/spectral_connectivity"]
omit = ["*/tests/*", "*/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    # Protocol stub bodies (``...``) never run
    "^\\s*\\.\\.\\.$",
]

# Tool configurations for linting/formatting
[tool.ruff]
line-length = 95
extend-exclude = [
    ".venv",
    "docs",
    "examples",  # Jupytext tutorial notebooks are deliberately not linted or formatted
    "build",
    "dist",
    "*.egg-info",
    "src/spectral_connectivity/_version.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
    "PD",   # pandas-vet
    "RUF",  # ruff-specific rules
    "ARG",  # unused arguments
    "EM",   # exception messages assigned before the raise
    "EXE",  # shebangs
    "FURB", # refurb modernizations
    "G",    # logging format
    "ICN",  # import conventions
    "ISC",  # implicit string concatenation
    "PERF", # performance anti-patterns
    "PGH",  # pygrep hooks (blanket noqa, type: ignore without code)
    "PIE",  # misc lints
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "RET",  # return statements
    "SIM",  # simplifications
    "T20",  # print statements
    "YTT",  # sys.version misuse
]
ignore = [
    "E501",    # line too long (handled by ruff format)
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["ARG"]  # pytest fixtures are used by name, not by value

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["spectral_connectivity"]

[tool.codespell]
# Notebook outputs embed base64 images, which read as misspellings.
skip = "uv.lock,*.ipynb,tests/__snapshots__"

[tool.mypy]
files = ["src/spectral_connectivity"]
mypy_path = "src"
# Target the Python version the quality/CI job runs on (3.12). NumPy's installed
# stubs use PEP 695 `type` statements, which mypy only parses when the target is
# >= 3.12; a 3.10 target makes mypy reject the stubs before checking the project.
# Runtime compatibility with 3.10+ is verified by the test matrix.
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# xarray's IndexVariable constructor is unannotated.
untyped_calls_exclude = ["xarray"]

# Per-module options
[[tool.mypy.overrides]]
module = [
    "nitime.*",
    "cupy.*",
    "cupyx.*",
    "xarray.*"
]
ignore_missing_imports = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/spectral_connectivity/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    # tests/test_docs.py and tests/test_cookbook.py read these, so the suite must
    # be runnable from the sdist.
    "/docs/generate_measure_table.py",
    "/docs/CONNECTIVITY_METRIC_RANGES.md",
    "/docs/cookbook.md",
    "/docs/llm_guide.md",
    "README.md",
    "LICENSE",
    "CITATION.cff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_connectivity"]
