name: spectral_connectivity
channels:
- conda-forge
- defaults
dependencies:
# Core dependencies (match pyproject.toml)
- python>=3.10
- "numpy >= 1.24, <3.0"
- "scipy >= 1.11.1"
- "xarray >= 2023.1"
- "matplotlib >= 3.7"
- nitime

# Development and testing (match the `dev` extra in pyproject.toml)
- "pytest >= 8.0"
- "pytest-cov >= 4.1"
- "syrupy >= 4.0"
- "mypy >= 1.11"  # PEP 695 `type` statement parsing (used by NumPy 2.x stubs)
- scipy-stubs
- netcdf4
- h5netcdf
- h5py

# Code formatting and linting (ruff handles both format and lint)
- "ruff >= 0.8.0"

# Documentation
- "numpydoc >= 1.6"
- sphinx
- sphinx-copybutton
- sphinx-autoapi

# Jupyter environment
- jupyter
- jupyterlab

# CI/Build tools
- hatch
- build
- twine
