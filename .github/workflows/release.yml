name: Test, Build, and Publish

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

# Read-only by default (Scientific Python SPEC 8); the publish, release, and
# attestation jobs elevate only the scopes they need.
permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run ruff formatting check
        run: ruff format --check spectral_connectivity/ tests/
      - name: Run ruff linting
        run: ruff check spectral_connectivity/ tests/ --output-format=github
      - name: Run mypy type checking
        run: mypy spectral_connectivity/
      - name: Run docstring examples (doctests)
        run: pytest --doctest-modules spectral_connectivity/

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run tests with coverage
        run: pytest --cov=spectral_connectivity --cov-report=xml --cov-report=term-missing tests/ --ignore=tests/test_notebooks.py
      - name: Run notebook snapshot tests
        # Snapshot (syrupy) comparisons use a tight rtol, so run them on a single
        # reference platform to avoid cross-platform float-precision flakiness.
        # The two notebook-execution checks are covered by the "Test notebooks"
        # step below and are deselected here.
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: pytest tests/test_notebooks.py -k "not executes"
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Test notebooks
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          pip install jupyter nbconvert
          for nb in examples/Tutorial_On_Simulated_Examples.ipynb examples/Tutorial_Using_Paper_Examples.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --ExecutePreprocessor.kernel_name=python3 --ExecutePreprocessor.timeout=1800 --execute "$nb"
          done

  test-min-deps:
    # Validate that the declared dependency floors are real: install the lowest
    # supported version of each runtime dependency (and the minimum Python) and
    # run the suite. A green matrix above only proves the code works with
    # whatever pip resolves (usually the latest), not with the stated minimums.
    name: Test minimum dependencies (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: Install minimum-supported dependency versions
        # Pin each declared floor to its EXACT lowest installable release (a
        # `1.24.*` glob would grab the newest 1.24 patch, not the 1.24.0 floor).
        # scipy 1.11.0 is yanked, so 1.11.1 is the lowest a `>=1.11.1` user
        # resolves. Install everything in ONE resolver invocation so a later
        # dependency (nitime, pytest, ...) cannot silently upgrade a pinned floor
        # -- a conflict fails the job instead. nitime requires numpy>=1.24, so it
        # stays on the 1.24.0 floor.
        run: |
          pip install \
            numpy==1.24.0 scipy==1.11.1 xarray==2023.1.0 matplotlib==3.7.0 \
            -e . pytest pytest-cov nitime
          pip check
      - name: Assert the pinned floors were not upgraded
        run: |
          python - <<'PY'
          import matplotlib, numpy, scipy, xarray
          expected = {
              "numpy": (numpy.__version__, "1.24.0"),
              "scipy": (scipy.__version__, "1.11.1"),
              "xarray": (xarray.__version__, "2023.1.0"),
              "matplotlib": (matplotlib.__version__, "3.7.0"),
          }
          for name, (got, want) in expected.items():
              print(f"{name}: {got} (want {want})")
          mismatched = {n: g for n, (g, w) in expected.items() if g != w}
          assert not mismatched, f"floors were upgraded: {mismatched}"
          PY
      - name: Run tests against minimum dependencies
        run: pytest tests/ --ignore=tests/test_notebooks.py -p no:warnings

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [quality, test, test-min-deps]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs to determine version from git tags
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  test-package:
    name: Test ${{ matrix.package }} install
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        package: ['wheel', 'sdist']
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install wheel
        if: matrix.package == 'wheel'
        run: pip install dist/*.whl
      - name: Install sdist
        if: matrix.package == 'sdist'
        run: pip install dist/*.tar.gz
      - name: Check import
        run: python -c "import spectral_connectivity; print('Version:', spectral_connectivity.__version__)"
      - name: Check dependency consistency
        run: pip check
      - name: Smoke-test the installed package
        # No repo checkout in this job, so these imports resolve to the built
        # wheel/sdist, not the source tree. A real end-to-end computation that
        # fails loudly -- the previous `pytest --pyargs ... || echo` collected no
        # tests (they are not shipped in the package) and the `|| echo` masked
        # both that and any genuine failure, so the step always "passed".
        run: |
          python - <<'PY'
          import numpy as np
          from spectral_connectivity import (
              Connectivity,
              Multitaper,
              multitaper_connectivity,
          )

          rng = np.random.default_rng(0)
          signals = rng.standard_normal((512, 5, 3))
          m = Multitaper(signals, sampling_frequency=500, time_halfbandwidth_product=3)
          c = Connectivity.from_multitaper(m)

          coherence = np.asarray(c.coherence_magnitude())
          assert coherence.shape[-2:] == (3, 3), coherence.shape
          # Off-diagonal coherence must be finite and in [0, 1].
          offdiag = coherence[..., 0, 1]
          assert np.isfinite(offdiag).all()
          assert (offdiag >= 0).all() and (offdiag <= 1 + 1e-8).all()

          granger = np.asarray(c.pairwise_spectral_granger_prediction())
          # The diagonal (self-Granger) is NaN by construction, so check an
          # off-diagonal directly -- np.nan_to_num would mask an all-NaN result.
          granger_off_diagonal = granger[..., 0, 1]
          assert np.isfinite(granger_off_diagonal).all()
          assert (granger_off_diagonal >= 0).all()

          ds = multitaper_connectivity(signals, sampling_frequency=500)
          assert "coherence_magnitude" in ds.data_vars
          print("Installed-package smoke test OK")
          PY

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # `environment: pypi` is the hook for a protected environment (SPEC 8);
    # configure required reviewers / branch restrictions on it in the repo's
    # Settings -> Environments so a publish needs manual approval.
    environment:
      name: pypi
      url: https://pypi.org/project/spectral-connectivity/
    permissions:
      id-token: write  # Trusted publishing (OIDC) + attestation signing
      attestations: write  # Generate build-provenance attestations (SPEC 8)
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: "dist/*"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Upload PEP 740 attestations to PyPI alongside the artifacts.
          attestations: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Extract release notes from CHANGELOG
        id: extract_notes
        run: |
          # Extract section between this version and next version marker
          sed -n '/## \[${{ steps.get_version.outputs.VERSION }}\]/,/## \[/p' CHANGELOG.md | sed '$d' > release_notes.md
          # If extraction failed, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release v${{ steps.get_version.outputs.VERSION }}" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
